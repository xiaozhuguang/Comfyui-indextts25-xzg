name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release & Notify Comfy Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify version matches node_list.json
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          ACTUAL=$(python3 -c "import json; print(json.load(open('node_list.json'))['version'])")
          echo "Tag version:  $EXPECTED"
          echo "node_list version: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Version mismatch! Tag v$EXPECTED != node_list.json $ACTUAL"
            exit 1
          fi

      - name: Generate release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the "## [VERSION] - date" section up to the next "## [" heading
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > BODY.md
          if [ ! -s BODY.md ]; then
            echo "::error::CHANGELOG.md has no section for version $VERSION"
            exit 1
          fi
          {
            echo "# Comfyui-indextts25-xzg v$VERSION"
            echo ""
            cat BODY.md
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Comfy Registry (dispatch workflow)
        run: |
          echo "Release v${{ steps.version.outputs.version }} published successfully."
          echo "Comfy Registry will automatically pick up the new tag within a few minutes."
          echo "Repository: ${{ github.repository }}"
          echo "Tag: v${{ steps.version.outputs.version }}"
