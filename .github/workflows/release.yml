name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify version matches node_list.json
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          ACTUAL=$(python3 -c "import json; print(json.load(open('node_list.json'))['version'])")
          echo "Tag version:  $EXPECTED"
          echo "node_list version: $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Version mismatch! Tag v$EXPECTED != node_list.json $ACTUAL"
            exit 1
          fi

      - name: Generate release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the "## [VERSION] - date" section up to the next "## [" heading
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > BODY.md
          if [ ! -s BODY.md ]; then
            echo "::error::CHANGELOG.md has no section for version $VERSION"
            exit 1
          fi
          {
            echo "# Comfyui-indextts25-xzg v$VERSION"
            echo ""
            cat BODY.md
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-node:
    name: Publish Custom Node to Comfy Registry
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Verify version consistency (pyproject == node_list.json)
        run: |
          PYV=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NLV=$(python3 -c "import json; print(json.load(open('node_list.json'))['version'])")
          echo "pyproject.toml version: $PYV"
          echo "node_list.json version:  $NLV"
          if [ "$PYV" != "$NLV" ]; then
            echo "::error::Version mismatch! pyproject.toml $PYV != node_list.json $NLV"
            exit 1
          fi

      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: true
